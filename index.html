<!DOCTYPE html>
<html lang="fr" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1A5C38">
<meta name="google" content="notranslate">
<meta name="description" content="Gérez vos commandes COD, closers et livreurs en temps réel">
<meta name="application-name" content="Teamly">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Teamly">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="msapplication-TileColor" content="#1A5C38">
<meta name="msapplication-TileImage" content="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" sizes="192x192" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/apple-touch-icon.png">
<title>Teamly</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#1A5C38}
input,select,textarea{font-size:16px}
button,[role="button"],a{transition:opacity 0.15s ease,transform 0.1s ease}
button:active,[role="button"]:active,a:active{opacity:0.7;transform:scale(0.98)}
#root{min-height:100vh;background:#F3F4F6}
@media(max-width:899px){
  #root{max-width:480px;margin:0 auto}
  *{scrollbar-width:none;-ms-overflow-style:none}
  *::-webkit-scrollbar{display:none}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
<script>if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");</script>
</body>
</html>
